services:
  postgres:
    image: postgres:17-alpine
    container_name: etrn-flow-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-etrn_flow_dev}
      POSTGRES_USER: ${POSTGRES_USER:-etrn_flow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-etrn_flow_local_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - etrn-flow-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  etrn-flow-postgres-data:
