name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: etrn_flow_test
          POSTGRES_USER: etrn_flow_test
          POSTGRES_PASSWORD: etrn_flow_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U etrn_flow_test -d etrn_flow_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Production dependency audit
        run: pnpm audit --prod --audit-level high

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Apply database migrations
        run: pnpm db:migrate
        env:
          DATABASE_URL: postgres://etrn_flow_test:etrn_flow_test_password@127.0.0.1:5432/etrn_flow_test

      - name: Persistence integration tests
        run: pnpm test:integration
        env:
          DATABASE_URL: postgres://etrn_flow_test:etrn_flow_test_password@127.0.0.1:5432/etrn_flow_test

      - name: Build
        run: pnpm build

      - name: Install Playwright Chromium
        run: corepack pnpm exec playwright install --with-deps chromium

      - name: Browser E2E tests
        id: browser-e2e
        run: corepack pnpm e2e
        env:
          DATABASE_URL: postgres://etrn_flow_test:etrn_flow_test_password@127.0.0.1:5432/etrn_flow_test

      - name: Upload Playwright failure artifacts
        if: failure() && steps.browser-e2e.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-artifacts
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  security:
    name: Security scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Secret scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  production-stack:
    name: Production stack
    runs-on: ubuntu-latest
    env:
      POSTGRES_DB: etrn_flow_ci
      POSTGRES_USER: etrn_flow_ci
      POSTGRES_PASSWORD: etrn_flow_ci_password
      DATABASE_URL: postgres://etrn_flow_ci:etrn_flow_ci_password@postgres:5432/etrn_flow_ci
      NODE_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: 3000
      LOG_LEVEL: info
      GUEST_SESSION_COOKIE_NAME: etrn_guest_session
      GUEST_SESSION_TTL_SECONDS: 86400
      GUEST_SESSION_COOKIE_SECURE: false
      GUEST_SESSION_COOKIE_SAME_SITE: lax
      GUEST_SESSION_MUTATION_LIMIT: 60
      GUEST_SESSION_RESET_LIMIT: 8
      GUEST_SESSION_RATE_WINDOW_SECONDS: 10
      GUEST_SESSION_RATE_MAX_REQUESTS: 6

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate production Compose configuration
        run: docker compose -f infra/compose/docker-compose.prod.yml config

      - name: Build production images
        run: docker compose -f infra/compose/docker-compose.prod.yml build

      - name: Start production database
        run: docker compose -f infra/compose/docker-compose.prod.yml up -d postgres

      - name: Run production migrations
        run: docker compose -f infra/compose/docker-compose.prod.yml run --rm migrate

      - name: Start production API and web
        run: docker compose -f infra/compose/docker-compose.prod.yml up -d api web

      - name: Wait for production stack health
        run: |
          for service in postgres api web; do
            for attempt in {1..30}; do
              status="$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "etrn-flow-prod-${service}" 2>/dev/null || true)"
              if [ "$status" = "healthy" ]; then
                echo "$service is healthy"
                break
              fi
              if [ "$attempt" = "30" ]; then
                echo "$service did not become healthy; status=$status"
                exit 1
              fi
              sleep 2
            done
          done

      - name: Production same-origin smoke
        run: |
          curl -fsS http://127.0.0.1:8083/health
          curl -fsS -c cookies.txt http://127.0.0.1:8083/api/session | grep '"session"'
          grep etrn_guest_session cookies.txt
          curl -fsS -b cookies.txt -X POST http://127.0.0.1:8083/api/demo/bootstrap | grep '"shipmentCount":3'
          curl -fsS -b cookies.txt http://127.0.0.1:8083/api/shipments | grep 'DEMO-001'

      - name: Production response-header smoke
        run: |
          assert_header() {
            headers_file="$1"
            header_name="$2"
            expected_value="${3:-}"
            if [ -n "$expected_value" ]; then
              if ! grep -i "^${header_name}: .*${expected_value}" "$headers_file"; then
                echo "Expected ${header_name} matching '${expected_value}' in ${headers_file}"
                cat "$headers_file"
                exit 1
              fi
              return
            fi
            if ! grep -i "^${header_name}:" "$headers_file"; then
              echo "Expected ${header_name} in ${headers_file}"
              cat "$headers_file"
              exit 1
            fi
          }

          assert_exact_header() {
            headers_file="$1"
            header_name="$2"
            expected_value="$3"
            actual_value="$(grep -i "^${header_name}:" "$headers_file" | head -n 1 | sed -E 's/^[^:]+:[[:space:]]*//' | tr -d '\r')"
            if [ "$actual_value" != "$expected_value" ]; then
              echo "Expected exact ${header_name} value '${expected_value}' in ${headers_file}"
              cat "$headers_file"
              exit 1
            fi
          }

          assert_security_headers() {
            headers_file="$1"
            assert_exact_header "$headers_file" "Content-Security-Policy" "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self';"
            assert_header "$headers_file" "X-Content-Type-Options" "nosniff"
            assert_header "$headers_file" "X-Frame-Options" "DENY"
            assert_header "$headers_file" "Referrer-Policy" "strict-origin-when-cross-origin"
            assert_header "$headers_file" "Permissions-Policy" "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
          }

          curl -fsS -D root.headers -o root.html http://127.0.0.1:8083/
          assert_security_headers root.headers
          assert_header root.headers "Cache-Control" "no-store"

          curl -fsS -D index.headers -o /dev/null http://127.0.0.1:8083/index.html
          assert_security_headers index.headers
          assert_header index.headers "Cache-Control" "no-store"

          asset_path="$(grep -oE '/assets/[^"]+\.(js|css)' root.html | head -n 1)"
          if [ -z "$asset_path" ]; then
            echo "Could not find built asset path in root HTML"
            cat root.html
            exit 1
          fi

          curl -fsS -D asset.headers -o /dev/null "http://127.0.0.1:8083${asset_path}"
          assert_security_headers asset.headers
          assert_header asset.headers "Cache-Control" "public, max-age=31536000, immutable"

          curl -fsS -D health.headers -o /dev/null http://127.0.0.1:8083/health
          assert_security_headers health.headers

          curl -fsS -D session.headers -o /dev/null -c cookies.txt http://127.0.0.1:8083/api/session
          assert_security_headers session.headers

      - name: Verify production port exposure
        run: |
          web_ports="$(docker inspect etrn-flow-prod-web --format '{{json .NetworkSettings.Ports}}')"
          api_ports="$(docker inspect etrn-flow-prod-api --format '{{json .NetworkSettings.Ports}}')"
          postgres_ports="$(docker inspect etrn-flow-prod-postgres --format '{{json .NetworkSettings.Ports}}')"
          echo "web: $web_ports"
          echo "api: $api_ports"
          echo "postgres: $postgres_ports"
          echo "$web_ports" | grep '"8080/tcp":\[{"HostIp":"127.0.0.1","HostPort":"8083"}\]'
          echo "$api_ports" | grep '"3000/tcp":null'
          echo "$postgres_ports" | grep '"5432/tcp":null'

      - name: Print production stack logs on failure
        if: failure()
        run: docker compose -f infra/compose/docker-compose.prod.yml logs --no-color

      - name: Remove production stack
        if: always()
        run: docker compose -f infra/compose/docker-compose.prod.yml down -v --remove-orphans
