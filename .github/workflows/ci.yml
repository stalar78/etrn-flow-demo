name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: etrn_flow_test
          POSTGRES_USER: etrn_flow_test
          POSTGRES_PASSWORD: etrn_flow_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U etrn_flow_test -d etrn_flow_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Apply database migrations
        run: pnpm db:migrate
        env:
          DATABASE_URL: postgres://etrn_flow_test:etrn_flow_test_password@127.0.0.1:5432/etrn_flow_test

      - name: Persistence integration tests
        run: pnpm test:integration
        env:
          DATABASE_URL: postgres://etrn_flow_test:etrn_flow_test_password@127.0.0.1:5432/etrn_flow_test

      - name: Build
        run: pnpm build

      - name: Install Playwright Chromium
        run: corepack pnpm exec playwright install --with-deps chromium

      - name: Browser E2E tests
        id: browser-e2e
        run: corepack pnpm e2e
        env:
          DATABASE_URL: postgres://etrn_flow_test:etrn_flow_test_password@127.0.0.1:5432/etrn_flow_test

      - name: Upload Playwright failure artifacts
        if: failure() && steps.browser-e2e.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-artifacts
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
